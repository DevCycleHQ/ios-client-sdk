name: Build and Test iOS

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build_ios:
    runs-on: macos-26
    steps:
      - name: Checkout Project
        uses: actions/checkout@v7

      - name: "Select Latest Xcode"
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable

      - name: "Carthage Cached Bootstrap"
        uses: DevCycleHQ/carthage-bootstrap@v1.2.0
        with:
          github-token: ${{ secrets.AUTOMATION_USER_TOKEN }}
          use-xcframeworks: true

      - name: Fastlane iOS Tests
        run: fastlane ios tests
        timeout-minutes: 15
